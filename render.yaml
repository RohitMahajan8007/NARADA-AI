services:
  # Single Web Service - Backend serves Frontend too
  - type: web
    name: web-monitor
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && rm -rf backend/public && mkdir -p backend/public && cp -r frontend/dist/* backend/public/
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: SEMRUSH_USER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
